<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 14.00 WebKit Research Harness</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>PS5 14.00 WebKit Research Harness</h1>
        <div class="subtitle">Firmware: 26.06-14.00.00.39-00.00.00.0.1 | WebKit/JSC</div>
        <div class="controls">
            <div class="control-group">
                <label>Level:
                    <select id="testLevel">
                        <option value="safe" selected>SAFE</option>
                        <option value="moderate">MODERATE</option>
                        <option value="stress">STRESS</option>
                    </select>
                </label>
            </div>
            <div class="control-group">
                <label>Seed: <input type="number" id="seed" value="12345" min="0" max="999999999"></label>
            </div>
            <div class="control-group">
                <label>Iterations: <input type="number" id="iterations" value="1000" min="1" max="100000"></label>
            </div>
            <div class="control-group">
                <label>Timeout (ms): <input type="number" id="timeout" value="5000" min="100" max="60000"></label>
            </div>
            <div class="control-group">
                <label>Suite:
                    <select id="testSuite">
                        <option value="all" selected>All</option>
                        <option value="typedarrays">TypedArrays</option>
                        <option value="wasm">WASM</option>
                        <option value="promises">Promises</option>
                        <option value="objects">Objects</option>
                        <option value="regexp">RegExp</option>
                        <option value="workers">Workers</option>
                        <option value="gc-pressure">GC Pressure</option>
                    </select>
                </label>
            </div>
            <div class="control-group">
                <button id="btnRun">Run Tests</button>
                <button id="btnStop">Stop</button>
                <button id="btnCompatibility">Compatibility</button>
                <button id="btnExportJSON">Export JSON</button>
                <button id="btnExportTXT">Export TXT</button>
            </div>
        </div>
    </header>

    <main>
        <section id="environment" class="panel">
            <h2>Environment</h2>
            <div id="envGrid" class="grid"></div>
        </section>

        <section id="compatibility" class="panel">
            <h2>Compatibility</h2>
            <div id="compatGrid" class="grid"></div>
            <div class="progress-container">
                <div id="compatProgress" class="progress-bar"></div>
            </div>
        </section>

        <section id="targeted-tests" class="panel">
            <h2>Targeted Tests</h2>
            <div id="testResults" class="test-results"></div>
        </section>

        <section id="fuzzing" class="panel">
            <h2>Fuzzing</h2>
            <div id="fuzzStatus" class="status">Ready</div>
            <div class="progress-container">
                <div id="fuzzProgress" class="progress-bar"></div>
            </div>
            <div id="fuzzStats" class="stats"></div>
        </section>

        <section id="stress-tests" class="panel">
            <h2>Stress Tests</h2>
            <div id="stressResults" class="test-results"></div>
        </section>

        <section id="anomaly-log" class="panel">
            <h2>Crash/Anomaly Log</h2>
            <div id="anomalyList" class="anomaly-list"></div>
        </section>

        <section id="report" class="panel">
            <h2>Report</h2>
            <div id="reportSummary" class="summary"></div>
            <div class="export-buttons">
                <button id="btnExportReport">Export Full Report (HTML)</button>
                <button id="btnExportJSON2">Export JSON</button>
                <button id="btnExportTXT2">Export TXT</button>
            </div>
        </section>
    </main>

    <footer>
        <div class="stats-summary">
            <span id="statTests">Tests: 0</span>
            <span id="statAnomalies">Anomalies: 0</span>
            <span id="statDuration">Duration: 0ms</span>
            <span id="statIterations">Iterations: 0</span>
        </div>
    </footer>

    <script src="tests/typedarrays.js"></script>
    <script src="tests/wasm.js"></script>
    <script src="tests/promises.js"></script>
    <script src="tests/objects.js"></script>
    <script src="tests/regexp.js"></script>
    <script src="tests/workers.js"></script>
    <script src="tests/gc-pressure.js"></script>
    <script src="fuzz.js"></script>
    <script src="app.js"></script>
</body>
</html>
